name: Android APK

# Builds on every pull request; on pushes to main also publishes a release,
# so the newest APK is always at
# https://github.com/Dev-uzair/expense_tracker/releases/latest/download/expense-tracker.apk
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter build apk --release

      - run: mv build/app/outputs/flutter-apk/app-release.apk expense-tracker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: expense-tracker-apk
          path: expense-tracker.apk

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: expense-tracker-apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Expense Tracker build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Android APK built from ${{ github.sha }}.
            Signed with a debug key: fine for installing on your own phone,
            not for the Play Store.
          files: expense-tracker.apk
