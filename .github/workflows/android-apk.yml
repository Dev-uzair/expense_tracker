name: Android APK

# Builds on every pull request; on pushes to main also publishes a release,
# so the newest APK is always at
# https://github.com/Dev-uzair/expense_tracker/releases/latest/download/expense-tracker.apk
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Pinned so a new Flutter release can't raise the Android toolchain
      # minimums (Gradle/AGP/Kotlin) out from under the build.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - run: flutter pub get

      # Uses the permanent signing key when the ANDROID_KEYSTORE_* secrets are
      # set, so new APKs install over old ones. Without them (e.g. PRs from
      # forks) the build falls back to a throwaway debug key.
      - name: Set up release signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing secrets; using the debug key."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - run: flutter build apk --release

      - run: mv build/app/outputs/flutter-apk/app-release.apk expense-tracker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: expense-tracker-apk
          path: expense-tracker.apk

    outputs:
      signed: ${{ steps.signing.outputs.signed }}

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: expense-tracker-apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Expense Tracker build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Android APK built from ${{ github.sha }}.
            ${{ needs.build.outputs.signed == 'true' && 'Signed with the app''s release key: installs over earlier releases signed with the same key.' || 'Signed with a throwaway debug key: uninstall the previous version before installing.' }}
          files: expense-tracker.apk
